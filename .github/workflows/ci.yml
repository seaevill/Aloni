name: CI
# One run per PR: a newer push cancels the older run (never on main). Documentation-only changes skip the heavy jobs but STILL report «check» and «sql» as green: the jobs themselves always run
# (a workflow-level paths filter would leave a required check «Pending» for ever). On main every job runs in full.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.f.outputs.code }}
      sql: ${{ steps.f.outputs.sql }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: f
        name: What changed (anything but documentation = code; supabase, workflows and scripts = sql)
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "code=true" >> "$GITHUB_OUTPUT"; echo "sql=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE"...HEAD)
          echo "$files"
          code=false; sql=false
          if [ -n "$files" ] && echo "$files" | grep -qvE '^(docs/|RUNBOOK\.md$|.*\.md$)'; then code=true; fi
          if echo "$files" | grep -qE '^(supabase/|\.github/|scripts/)'; then sql=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"; echo "sql=$sql" >> "$GITHUB_OUTPUT"

  static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: No node_modules may be committed (not even as a symlink)
        run: test -z "$(git ls-files | grep -E '(^|/)node_modules(/|$)' | head -1)"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (safety bans)
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npm test

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: e2e (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # WebKit and its system packages are already in this image (no apt-get at run time); keep the tag equal to playwright-core in package-lock.json
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    env:
      PLAYWRIGHT_IMAGE_VERSION: 1.65.1
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: WebKit comes with the container image; check the image matches the locked Playwright version
        # 2026-11-24 (night watch): on three of the last five main commits (8333d6a, a13f26f, 531e006) BOTH install tries timed out while apt-get
        # was still downloading WebKit's system packages from the Ubuntu mirror (~290 kB/s). The job now runs in Playwright's own image, which
        # already holds WebKit and every system package, so nothing is installed with apt. When Playwright is upgraded in package-lock.json,
        # this step fails with a clear message until the image tag above is changed to the same version.
        run: |
          want="$(node -p "require('../package-lock.json').packages['node_modules/playwright-core'].version")"
          have="$(npx playwright --version | awk '{print $2}')"
          echo "locked: $want, in image: $PLAYWRIGHT_IMAGE_VERSION, npx: $have"
          if [ "$want" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::Playwright in package-lock.json is $want but the e2e container image is v$PLAYWRIGHT_IMAGE_VERSION: change both 'image:' and PLAYWRIGHT_IMAGE_VERSION in ci.yml to v$want"
            exit 1
          fi
        working-directory: app
      - name: E2E at 375 px (WebKit), one third of the files
        run: npx playwright test --trace off --shard=${{ matrix.shard }}/3
        working-directory: app
      - name: Performance report (size and first load; only WARNS, never fails)
        if: always() && matrix.shard == 1
        continue-on-error: true
        run: node scripts/perf-report.mjs
      - name: Upload screenshots of every screen (always)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screens-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.shard }}
          path: app/screenshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-${{ matrix.shard }}
          path: app/test-results
          retention-days: 7

  # The ONE required check: green when every part ran green OR was skipped because only documentation changed. It always runs, so it is never «Pending».
  check:
    if: always()
    needs: [changes, static, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part green or skipped
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.static.result }} ${{ needs.e2e.result }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != success ] && [ "$r" != skipped ]; then echo "a part ended with: $r"; exit 1; fi
          done
          echo "all parts: $RESULTS"

  sql:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_PASSWORD: test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nothing in supabase, scripts or workflows changed
        if: needs.changes.outputs.sql != 'true'
        run: echo "documentation or app-only change - the database tests are skipped here (they run in full on main)"
      - name: Upgrade test (a database with data under 0001-0009 gets 0010+ on top)
        if: needs.changes.outputs.sql == 'true'
        run: bash supabase/tests/upgrade.sh
      - name: The exact `supabase db push` of the workflow, with the pinned CLI, against a throwaway database
        if: needs.changes.outputs.sql == 'true'
        run: bash supabase/tests/cli_push.sh
      - name: The workflow's gate (exact commit, finished, green) and result parser
        if: needs.changes.outputs.sql == 'true'
        run: bash scripts/ci-gate.test.sh
      - name: SQL tests on a bare PostGIS (all migrations, then every SQL test)
        if: needs.changes.outputs.sql == 'true'
        run: bash supabase/tests/run.sh plain
      - name: SQL tests with the Supabase layout (extensions schema, search_path) - the auth schema is a STUB, not Supabase Auth
        if: needs.changes.outputs.sql == 'true'
        run: bash supabase/tests/run.sh supabase

  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: PR must stay small (450 changed lines)
        run: scripts/pr-size.sh "origin/${{ github.base_ref }}"
