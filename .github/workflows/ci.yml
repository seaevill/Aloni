name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: No node_modules may be committed (not even as a symlink)
        run: test -z "$(git ls-files | grep -E '(^|/)node_modules(/|$)' | head -1)"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (safety bans)
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npm test
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
        working-directory: app
      - name: E2E at 375 px (WebKit)
        run: npx playwright test --trace off
        working-directory: app
      - name: Upload screenshots of every screen (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ github.event.pull_request.number || github.run_id }}
          path: app/screenshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: app/test-results
          retention-days: 7

  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_PASSWORD: test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade test (a database with data under 0001-0009 gets 0010+ on top)
        run: bash supabase/tests/upgrade.sh
      - name: The exact `supabase db push` of the workflow, with the pinned CLI, against a throwaway database
        run: bash supabase/tests/cli_push.sh
      - name: The workflow's gate (exact commit, finished, green) and result parser
        run: bash scripts/ci-gate.test.sh
      - name: SQL tests on a bare PostGIS (all migrations, then every SQL test)
        run: bash supabase/tests/run.sh plain
      - name: SQL tests with the Supabase layout (extensions schema, search_path) - the auth schema is a STUB, not Supabase Auth
        run: bash supabase/tests/run.sh supabase

  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR must stay small (450 changed lines)
        run: scripts/pr-size.sh "origin/${{ github.base_ref }}"
