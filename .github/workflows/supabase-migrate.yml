name: Supabase migrate (manual)

# Applies supabase/migrations/*.sql to the Supabase project with `supabase db push`; the CLI keeps the history in Supabase's own table
# (supabase_migrations.schema_migrations). Three SEPARATE controls stand before the secrets are used:
#   1. job `guard` (no environment, no secrets): started by hand, from `main` only, mode/confirm typed correctly, and the EXACT commit being applied has green
#      `check`, `sql` and production Workers Builds results (scripts/ci-gate.sh: another commit's green does not count; missing/unfinished = stop);
#   2. the GitHub ENVIRONMENT `supabase-production`: the job `migrate` cannot start (so no step can read a secret) until the environment's required reviewer approves.
#      The workflow file only NAMES the environment; that the reviewer rule is really switched on is a GitHub setting this file cannot enforce (RUNBOOK §10.1);
#   3. the word APPLY (mode=apply AND confirm=APPLY): checked in `guard` and again right before `supabase db push`.
# The first run must be `dry-run`. Secrets (environment `supabase-production`; the token needs Connection Pooling = Read): SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF. Nothing prints them.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run lists what would be applied and changes nothing; apply really applies'
        type: choice
        options: [dry-run, apply]
        default: dry-run
      confirm:
        description: 'Type APPLY to allow mode=apply (ignored for dry-run)'
        type: string
        default: ''

permissions:
  contents: read
  checks: read

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.122.1          # pinned (tested in CI against a throwaway database: supabase/tests/cli_push.sh); change it only together with that test
  EXPECT_PROJECT_NAME: aloni             # RUNBOOK §9 step 3
  EXPECT_REGION: eu-central-1            # Frankfurt

jobs:
  guard:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Mode, confirmation and the exact commit
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo "::error::checked-out commit is not $GITHUB_SHA"; exit 1; }
          if [ "$MODE" = apply ]; then
            [ "$CONFIRM" = APPLY ] || { echo "::error::mode=apply needs the confirm field to be exactly APPLY. Nothing was applied."; exit 1; }
          fi
          echo "mode=$MODE commit=$GITHUB_SHA"
      - name: The CI and the production deploy of THIS commit are green
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" | bash scripts/ci-gate.sh "$GITHUB_SHA"
      - name: The migration files are in order and there are no gaps
        run: |
          set -euo pipefail
          i=1
          for f in supabase/migrations/*.sql; do
            n=$(basename "$f" | cut -d_ -f1)
            [ "$((10#$n))" -eq "$i" ] || { echo "::error::Migration numbering has a gap or a duplicate at $f (expected $i)"; exit 1; }
            i=$((i + 1))
          done
          echo "$((i - 1)) migration files, numbered 1..$((i - 1))"

  migrate:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: supabase-production      # the required-reviewer approval happens HERE, before any step of this job runs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: The same commit, checked again after the approval (the approval can come hours later)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo "::error::checked-out commit is not $GITHUB_SHA"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" | bash scripts/ci-gate.sh "$GITHUB_SHA"

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: The target is the right project (Supabase Management API), not just a file
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z]{20}$ ]] || { echo "::error::SUPABASE_PROJECT_REF does not look like a project reference (20 lowercase letters)"; exit 1; }
          code=$(curl -sS -o project.json -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" || true)
          [ "$code" = 200 ] || { rm -f project.json; echo "::error::API call «read the project» (GET /v1/projects/{ref}) answered HTTP $code. 401/403 = the token lacks the right to read this project (or it is revoked/expired); 404 = wrong project reference. Nothing was applied."; exit 1; }
          jq -e --arg ref "$SUPABASE_PROJECT_REF" --arg name "$EXPECT_PROJECT_NAME" --arg region "$EXPECT_REGION" '.id == $ref and .name == $name and .region == $region' project.json >/dev/null \
            || { echo "::error::the project is not the expected one (id/name/region differ; expected name=$EXPECT_PROJECT_NAME region=$EXPECT_REGION). Nothing was applied."; jq -r '"found: name=\(.name) region=\(.region) status=\(.status)"' project.json; rm -f project.json; exit 1; }
          jq -r '"target project: name=\(.name) region=\(.region) status=\(.status)"' project.json
          rm -f project.json

      - name: The database address (IPv4 session pooler named by the Management API; the runner has no IPv6)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          echo "::add-mask::$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p | @uri')"
          code=$(curl -sS -o pooler.json -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/database/pooler" || true)
          [ "$code" = 200 ] || { rm -f pooler.json; echo "::error::API call «read the connection pooler address» (GET /v1/projects/{ref}/config/database/pooler) answered HTTP $code. 401/403 = the token lacks the right «Connection Pooling = Read» (add only that right, RUNBOOK 10.1a); 404 = wrong project reference. Nothing was changed."; exit 1; }
          umask 077
          bash scripts/pooler-url.sh "$SUPABASE_PROJECT_REF" < pooler.json > "$RUNNER_TEMP/dburl"
          rm -f pooler.json
          echo "pooler: $(sed -E 's#^postgresql://([^:]+):[^@]*@([^/]+)/.*#user=\1 host=\2#' "$RUNNER_TEMP/dburl")"

      - name: What would be applied (changes nothing)
        run: supabase db push --db-url "$(cat "$RUNNER_TEMP/dburl")" --dry-run

      - name: Apply the migrations in order
        if: inputs.mode == 'apply'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = APPLY ] || { echo "::error::mode=apply needs the confirm field to be exactly APPLY. Nothing was applied."; exit 1; }
          supabase db push --db-url "$(cat "$RUNNER_TEMP/dburl")"

      - name: Verify (read-only supabase/tests/verify_applied.sql, same pooler address)
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          psql "$(cat "$RUNNER_TEMP/dburl")" -X -q -At -v ON_ERROR_STOP=1 -f supabase/tests/verify_applied.sql | jq -R '{problem: .}' | jq -s . > answer.json
          bash scripts/verify-result.sh < answer.json
          rm -f answer.json
