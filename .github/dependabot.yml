# Weekly, grouped: one PR for npm and one for GitHub Actions (pins stay SHA + version comment).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    groups:
      npm-weekly: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    groups:
      actions-weekly: { patterns: ["*"] }
