<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17201a">
<meta name="format-detection" content="telephone=no">
<title>FieldWise Megara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f1f3ec; --card:#ffffff; --ink:#111a14; --ink2:#34413a; --line:#c9d1c3; --line2:#e2e7dc;
  --hd:#17201a; --hd2:#26332a; --hdtext:#f3f5ef; --hdsub:#cfdac9;
  --acc:#1a5c36; --acc-ink:#fff; --acc-soft:#e1efe3;
  --risk:#9a3d00; --risk-bg:#fdeee2; --high:#a3220f; --high-bg:#fbe7e3;
  --ok:#174a8a; --ok-bg:#e4edf9; --warn-bg:#fff4cf; --warn:#5a4300;
  --fc:#eef3fb; --fcline:#4c6f9e;
  --r:14px; --tab-h:64px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --font:Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  --disp:"Bricolage Grotesque",Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
body.hc{ --bg:#fff; --card:#fff; --ink:#000; --ink2:#111; --line:#000; --line2:#555; --acc:#003d1c; --fc:#fff; --hdsub:#fff }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#d9ded3;color:var(--ink);font:400 16px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:rgba(26,92,54,.15)}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #2f7de1;outline-offset:2px}
.app{position:relative;max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);box-shadow:0 0 0 1px rgba(0,0,0,.06)}
/* header */
.hdr{position:-webkit-sticky;position:sticky;top:0;z-index:20;background:var(--hd);color:var(--hdtext);padding:calc(var(--sat) + 8px) calc(12px + var(--sar)) 8px calc(12px + var(--sal))}
.hdr-row{display:flex;align-items:center;gap:8px;min-height:52px}
.hdr h1{margin:0;font:700 22px/1.15 var(--disp);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hdr .sub{font-size:14px;color:var(--hdsub);font-weight:500}
.back{display:flex;align-items:center;gap:4px;min-width:48px;min-height:48px;padding:0 12px 0 6px;border-radius:12px;background:var(--hd2);color:var(--hdtext);font-weight:600;font-size:16px;flex:none}
.back svg{width:22px;height:22px}
.samp{display:flex;gap:6px;align-items:center;margin:6px 0 0;font-size:14px;line-height:1.3;color:#1d1a08;background:#f2d46b;border-radius:8px;padding:4px 8px}
.samp b{font-weight:700;letter-spacing:.02em}
main{padding:12px calc(16px + var(--sar)) calc(var(--tab-h) + var(--sab) + 28px) calc(16px + var(--sal))}
/* tabbar */
.tabs{position:fixed;z-index:30;bottom:0;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:flex;padding:0 var(--sar) var(--sab) var(--sal)}
.tab{flex:1;min-width:0;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;font-weight:600;color:var(--ink2);position:relative}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--acc)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:4px;border-radius:0 0 4px 4px;background:var(--acc)}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
/* generic */
h2{font:700 20px/1.2 var(--disp);margin:22px 0 10px}
h2:first-child{margin-top:6px}
h3{font-size:17px;margin:0 0 6px;line-height:1.3}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.muted{color:var(--ink2);font-size:14px}
.small{font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv{display:grid;grid-template-columns:minmax(0,44%) minmax(0,1fr);gap:4px 10px;font-size:15px;margin:0}
.kv dt{color:var(--ink2);font-size:14px;padding-top:1px}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 16px;border-radius:12px;font-weight:700;font-size:16px;border:2px solid var(--ink);background:var(--card);text-align:center;line-height:1.2}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.blk{width:100%}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.lnk{color:var(--acc);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;display:inline-block;min-height:44px;padding:10px 0;margin:-10px 0;text-align:left;vertical-align:baseline}
.links{margin-top:8px;font-size:15px;line-height:1.9}
.sub-l{color:var(--ink2);font-size:15px;margin-top:2px}
details.more{margin-top:6px}
details.more>summary{list-style:none;display:inline-flex;align-items:center;gap:4px;min-height:44px;font-weight:700;color:var(--ink2);cursor:pointer}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary .chev{-webkit-transform:rotate(90deg);transform:rotate(90deg)}
.lw{color:var(--ok);font-weight:800}
.sowrec{margin-top:10px;padding-top:10px;border-top:1px solid var(--line2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:700;line-height:1.2;border-radius:999px;padding:5px 10px;border:1.5px solid currentColor;max-width:100%;text-align:left}
.pill.high{color:var(--high);background:var(--high-bg)}
.pill.medium{color:var(--risk);background:var(--risk-bg)}
.pill.low,.pill.ok{color:var(--ok);background:var(--ok-bg)}
.pill.neutral{color:var(--ink2);background:var(--card)}
.pill.good{color:var(--acc);background:var(--acc-soft)}
.pill.warn{color:var(--warn);background:var(--warn-bg)}
.listbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:0 0 10px;text-align:left}
.listbtn .t{font-weight:700;font-size:17px;line-height:1.25}
.listbtn .ic{width:40px;height:40px;border-radius:10px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.listbtn .ic svg{width:24px;height:24px}
.chev{width:20px;height:20px;flex:none;color:var(--ink2)}
.cn-el{font-weight:700}
.gloss{color:var(--ink2);font-weight:500;font-size:max(14px,.88em)}
.bar{height:12px;border-radius:6px;background:var(--line2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--acc)}
/* weather now */
.now{background:var(--hd);color:var(--hdtext);border-radius:var(--r);padding:12px;margin-bottom:12px}
.now .grid2>div{background:var(--hd2);border-radius:10px;padding:10px}
.now .lab{font-size:14px;color:var(--hdsub)}
.now b{font-size:22px;display:block;line-height:1.2}
.now .stamp{font-size:14px;color:var(--hdsub);margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:6px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{font:700 26px/1.1 var(--disp);display:block}
.kpi .muted{display:block}
.kpi.wide{grid-column:1/-1;display:flex;align-items:center;gap:10px}
/* alerts */
.alert{border-left-width:6px}
.alert.high{border-left-color:var(--high)} .alert.medium{border-left-color:var(--risk)} .alert.low{border-left-color:var(--ok)}
.alert .ttl{font-weight:700;font-size:17px;margin:8px 0 2px;line-height:1.3}
.alert .act{margin-top:6px;font-weight:600}
/* weather strip */
.wx{display:flex;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;margin:6px 0 4px}
.wx-lab{flex:none;width:70px;border-right:1px solid var(--line);background:var(--card);font-size:14px;color:var(--ink2);font-weight:600}
.wx-sc{flex:1;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.wx-in{display:flex;width:max-content}
.wx-col{width:48px;flex:none;text-align:center;font-size:14px;border-right:1px solid var(--line2)}
.wx-col.fc{background:var(--fc);background-image:repeating-linear-gradient(135deg,transparent 0 7px,rgba(76,111,158,.10) 7px 9px)}
.wx-col.today{box-shadow:inset 0 0 0 3px var(--ink)}
.wx-c{height:30px;display:flex;align-items:center;justify-content:center;line-height:1.1}
.wx-c.band{height:26px;font-size:14px;font-weight:800;letter-spacing:.04em}
.wx-c.d{height:44px;flex-direction:column;font-weight:600}
.wx-c.d small{font-size:14px;font-weight:500}
.wx-c.rain{height:52px;flex-direction:column;justify-content:flex-end;padding-bottom:3px}
.rb{width:16px;background:#2f6db3;border-radius:3px 3px 0 0;min-height:0}
.wx-col.fc .rb{background:repeating-linear-gradient(0deg,#2f6db3 0 3px,#a9c4e6 3px 5px);outline:1px solid #2f6db3}
.wx-c.t{height:44px;flex-direction:column;font-weight:700}
.wx-c.t span:last-child{font-weight:500;color:var(--ink2)}
.gw{color:var(--risk);font-weight:800}
.wx-lab .wx-c{justify-content:flex-start;padding-left:6px;text-align:left}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:var(--ink2);margin-bottom:6px}
.sw{display:inline-block;width:16px;height:14px;border:1.5px solid var(--ink2);border-radius:3px;vertical-align:-2px;margin-right:4px;background:var(--card)}
.sw.fc{background:var(--fc);border-style:dashed;border-color:var(--fcline)}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 10px;margin:0 -2px}
.chip{flex:none;min-height:44px;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:15px}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
/* table */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 6px;border-bottom:1px solid var(--line2);text-align:right;vertical-align:top}
th{font-size:14px;color:var(--ink2);font-weight:700;background:var(--card)}
td:first-child,th:first-child{text-align:left}
tr.tot td{font-weight:800;border-top:2px solid var(--ink)}
/* sheet */
.ov{cursor:pointer;position:fixed;inset:0;top:0;left:0;right:0;bottom:0;z-index:50;background:rgba(10,15,12,.55);display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{cursor:auto;overscroll-behavior:contain;width:100%;max-width:480px;max-height:88vh;max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + var(--sab));box-shadow:0 -8px 30px rgba(0,0,0,.3)}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 6px}
.sheet-h{display:flex;align-items:flex-start;gap:8px}
.sheet-h h3{font:700 20px/1.25 var(--disp);flex:1;margin:10px 0 8px}
.x{min-width:48px;min-height:48px;border-radius:12px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.why-sec{margin:12px 0}
.why-sec .lab{font-size:14px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
textarea{width:100%;min-height:220px;font:16px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink);background:#fafbf8;resize:vertical;-webkit-appearance:none}
.toast{position:fixed;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);bottom:calc(var(--tab-h) + var(--sab) + 14px);z-index:60;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;max-width:90%;display:none}
.toast.on{display:block}
details.pl{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:0 0 12px}
details.pl>summary{list-style:none;padding:14px;min-height:56px;display:flex;align-items:center;gap:10px;cursor:pointer}
details.pl>summary::-webkit-details-marker{display:none}
details.pl>summary .chev{-webkit-transition:transform .15s;transition:transform .15s}
details.pl[open]>summary .chev{-webkit-transform:rotate(90deg);transform:rotate(90deg)}
details.pl .body{padding:0 14px 14px}
.sub-h{font-size:14px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px}
.divider{border-top:1px solid var(--line2);margin:12px 0}
.sd{display:grid;grid-template-columns:72px minmax(0,1fr) 46px;gap:6px;align-items:center;font-size:14px;margin:4px 0}
.sd .bx{height:16px;border-radius:4px;background:var(--line2);position:relative;overflow:hidden}
.sd .bx i{position:absolute;left:0;top:0;bottom:0;display:block}
.sd .sup i{background:var(--acc)}
.sd .dem i{background:repeating-linear-gradient(90deg,#5a4a1a 0 4px,#c8b26a 4px 7px)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-height:52px;min-width:64px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);font-weight:700;background:var(--card)}
.seg button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc);color:#fff}
.map{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--line);background:#e9eee2}
.empty{padding:16px;text-align:center;color:var(--ink2);border:2px dashed var(--line);border-radius:var(--r)}
.ico{width:18px;height:18px;vertical-align:-3px;flex:none}
@media (min-width:520px){ body{padding:0} .app{min-height:100vh} }
</style>
</head>

</div>

const GUST_MAX=20, LW_RISK=12, EXP_SOON_D=30;
function plantingsOf(f){return arr("plantings").filter(f)}
function sprayJobsFor(pl){return arr("jobs").filter(j=>j.kind==="spray"&&(j.planting_id===pl.id||(!j.planting_id&&j.parcel_id===pl.parcel_id))).sort((a,b)=>pd(b.date)-pd(a.date))}
function regFor(prod,cropId){return prod&&Array.isArray(prod.registered)?prod.registered.find(r=>r.crop_id===cropId):null}
const SAFE={};
function safety(pl){
  if(SAFE[pl.id])return SAFE[pl.id];
  const js=sprayJobsFor(pl);let safeFrom=null,reiUntil=null,last=js[0]||null,notReg=false;
  js.forEach(j=>{const p=PROD[j.product_id];const r=regFor(p,pl.crop_id);if(!r){if(j===last)notReg=true;return}
    const sf=addD(pd(j.date),Number(r.phi_days)||0);if(safeFrom==null||sf>safeFrom)safeFrom=sf;
    const ru=pd(j.date)+(Number(r.rei_h)||0)*36e5;if(reiUntil==null||ru>reiUntil)reiUntil=ru;});
  const lastProd=last?PROD[last.product_id]:null,lastReg=last?regFor(lastProd,pl.crop_id):null;
  return (SAFE[pl.id]={last,lastProd,lastReg,safeFrom,reiUntil,notReg,clear:safeFrom==null||safeFrom<=TODAY});
}
function mature(pl){const f=pd(pl.harvest_from);return pl.status==="ready"||pl.status==="harvesting"||(f!=null&&f<=TODAY)}
function onHold(pl){return mature(pl)&&!safety(pl).clear}
function harvLogged(pl){return arr("jobs").filter(j=>j.kind==="harvest"&&j.planting_id===pl.id).reduce((s,j)=>{const n=j.crates!=null?j.crates:(/(\d+)\s*crates?/i.exec(j.notes||"")||[])[1];return s+(Number(n)||0)},0)}
/* crates a planting can supply in [a,b): only days on/after harvest_from, PHI end and today;
   if cuts are logged, the remaining crates are spread over the remaining window */
function cratesIn(pl,a,b){
  const f=pd(pl.harvest_from),to=pd(pl.harvest_to);if(f==null||to==null)return 0;
  const sf=safety(pl).safeFrom;const start=Math.max(f,sf==null?f:sf,TODAY);if(start>to)return 0;
  const est=Number(pl.est_crates)||0,lg=harvLogged(pl);
  const rate=lg>0?Math.max(0,est-lg)/(diffD(to,start)+1):est/(diffD(to,f)+1);
  const s=Math.max(start,a),e=Math.min(to,b-DAY);if(e<s)return 0;return rate*(diffD(e,s)+1);
}
function harvest(a,b,f){return plantingsOf(f||(()=>true)).reduce((s,pl)=>s+cratesIn(pl,a,b),0)}

/* stock warnings: expiry (≤30 d, same as data rule) and low stock = less than 2 applications on the largest registered lot */
function nextAppNeed(p){let need=0;(p.registered||[]).forEach(r=>{const d=Number(r.dose_per_str)||0;plantingsOf(pl=>pl.crop_id===r.crop_id).forEach(pl=>{need=Math.max(need,d*(Number(pl.area_str)||0))})});return need}
function prodWarn(p){const out=[];const ex=pd(p.expiry);let exp=false;if(ex!=null){if(ex<TODAY){out.push('<span class="pill high">▲ '+esc(t("expired"))+' · '+fd(ex,true)+'</span>');exp=true}else if(diffD(ex,TODAY)<=EXP_SOON_D){out.push('<span class="pill medium">⏳ '+esc(t("expSoon"))+' · '+fd(ex,true)+'</span>');exp=true}}
  const need=nextAppNeed(p);const low=p.low_at!=null?Number(p.qty)<=Number(p.low_at):(need>0&&Number(p.qty)<2*need);if(!exp&&(low||p.low_stock))out.push('<span class="pill medium">▼ '+esc(t("lowStock"))+'</span>');return out.join(" ")}
/* rotation per lot where the product is registered; multi-site (M) groups = low resistance risk */
function rotationFor(p){const res=[];if(!p.group_system||p.group_system==="-")return res;
  arr("plantings").forEach(pl=>{if(!regFor(p,pl.crop_id))return;const j=sprayJobsFor(pl).find(j=>{const q=PROD[j.product_id];return q&&q.group_system===p.group_system&&q.type===p.type});
    if(j){const g=PROD[j.product_id].group_code;res.push({pl,j,g,same:g===p.group_code,multi:/^M/i.test(String(p.group_code))})}});return res}

}
let tt;function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("on"),2600)}

/* ---------- navigation (in-memory stack; history entries without hash so edge-swipe = Back) ---------- */
const TABS=["today","crops","parcels","stock","more"];
const ROOT={crop:"crops",parcel:"parcels",product:"stock",spraylog:"more",forecast:"more",orders:"more",settings:"more",about:"more"};
let HIST=0;
function cur(){return S.stack[S.stack.length-1]}
function tabOf(v){return TABS.indexOf(v)>=0?v:ROOT[v]||S.stack[0].v}
function push(v,id){cur().y=window.pageYOffset||0;S.stack.push({v,id});try{history.pushState({fw:S.stack.length},"");HIST++}catch(e){}render(true)}
function back(){if(S.stack.length>1){S.stack.pop();render(false,cur().y||0)}}
function navBack(){if(HIST>0&&S.stack.length>1){try{history.back();return}catch(e){HIST=0}}back()}
window.addEventListener("popstate",()=>{if(HIST>0)HIST--;closeSheet();back()});
function goTab(v){S.stack=[{v}];render(true)}
function render(top,y){
  const c=cur();const fn=V[c.v]||V.today;let r;
  try{r=fn(c.id)}catch(e){console.error(e);r={title:"FieldWise",html:'<div class="empty">'+esc(t("noData"))+'</div>'}}
  document.documentElement.lang=S.lang;document.body.classList.toggle("hc",S.hc);
  const isRoot=S.stack.length===1;
  document.getElementById("hdr").innerHTML='<div class="hdr-row">'+(isRoot?"":'<button class="back" data-back="1" aria-label="'+esc(t("back"))+'">'+I.back+'<span>'+esc(t("back"))+'</span></button>')+
   '<div style="flex:1;min-width:0"><h1>'+esc(r.title)+'</h1>'+(r.sub?'<div class="sub">'+esc(r.sub)+'</div>':"")+'</div></div>'+
   '<div class="samp" role="note"><span aria-hidden="true">⚠</span><span><b>'+esc(t("sample"))+'</b> – '+esc(t("sampleTxt"))+'</span></div>';
  const m=document.getElementById("main");m.innerHTML=r.html;
  const tab=tabOf(c.v);
  document.getElementById("tabs").innerHTML=TABS.map(k=>'<button class="tab" data-tab="'+k+'"'+(k===tab?' aria-current="page"':"")+'>'+I[k]+'<span>'+esc(t("tab_"+k))+'</span></button>').join("");
  m.querySelectorAll("[data-wx]").forEach(sc=>{const td=sc.querySelector(".today");if(td)sc.scrollLeft=Math.max(0,td.offsetLeft-sc.clientWidth+td.offsetWidth*4)});
  window.scrollTo(0,top?0:(y||0));
}
document.getElementById("ov").addEventListener("click",e=>{if(e.target.id==="ov")closeSheet()});
document.addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(!b)return;const d=b.dataset;
  if(d.close){closeSheet();return}
  if(d.copy){copyCsv();return}
  if(d.why){openWhy(d.why);return}
  if(d.go){closeSheet();const i=d.go.indexOf(":");push(d.go.slice(0,i),d.go.slice(i+1)||undefined);return}
  if(d.back){navBack();return}
  if(d.tab){goTab(d.tab);return}
  if(d.stockf){S.stockF=d.stockf;render(false,window.pageYOffset);return}
  if(d.logf){S.logF=d.logf;render(false,window.pageYOffset);return}
  if(d.csv){openCsv();return}
  if(d.lang){S.lang=d.lang;save();render(false,window.pageYOffset);return}
  if(d.area){S.area=d.area;save();render(false,window.pageYOffset);return}
  if(d.hc){S.hc=d.hc==="1";save();render(false,window.pageYOffset);return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(sheetOpen())closeSheet();else navBack()}});
render(true);
</script>
