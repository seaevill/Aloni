.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:30}

  if(!db){local.save("day."+date,day);return}
  const d=date;
  try{await ensureDay(d);await db.doc("days/"+d).update(patch)}catch(e){toast(e&&e.message||"Error")}
}
async function saveCfg(){
  render();
  if(!db){local.save("cfg",cfg);return}
  try{await db.doc("config/main").set(cfg)}catch(e){toast(e&&e.message||"Error")}
}
function watchDay(){
  if(unsubDay){unsubDay();unsubDay=null}
  if(!db){day=local.load("day."+date,emptyDay());render();return}
  day=emptyDay();render();
  const d=date;
  unsubDay=db.doc("days/"+d).onSnapshot(s=>{if(d!==date) return;day=s.exists?JSON.parse(JSON.stringify(s.data())):emptyDay();day.orders=day.orders||{};day.pos=day.pos||{};day.done=day.done||{};render()},()=>{});
}

/* ---------- derived ---------- */
const pName=id=>{const p=cfg.products.find(x=>x.id===id);return p?p.name:t("unknown")};
const cName=id=>{const c=cfg.clients.find(x=>x.id===id);return c?c.name:"?"};
function dayClients(){return Object.keys(day.pos).filter(c=>day.pos[c]>0).sort((a,b)=>day.pos[a]-day.pos[b])}
function itemsOf(cid){const o=day.orders[cid]||{};const ord=cfg.products.map(p=>p.id);return Object.keys(o).filter(p=>o[p]>0).sort((a,b)=>{const ia=ord.indexOf(a),ib=ord.indexOf(b);return (ia<0?999:ia)-(ib<0?999:ib)}).map(p=>[p,o[p]])}
function clientTotal(cid){return itemsOf(cid).reduce((s,[,q])=>s+q,0)}
function productTotals(){
  const m={};for(const c of dayClients()) for(const [p,q] of itemsOf(c)){(m[p]=m[p]||{q:0,by:[]});m[p].q+=q;m[p].by.push([c,q])}
  const ord=cfg.products.map(p=>p.id);
  return Object.keys(m).sort((a,b)=>{const ia=ord.indexOf(a),ib=ord.indexOf(b);return (ia<0?999:ia)-(ib<0?999:ib)}).map(p=>({p,...m[p]}));
}

/* ---------- render ---------- */
function render(){
  document.documentElement.lang=lang;
  const d=parseIso(date);
  $("#dayTitle").textContent=d.toLocaleDateString(LOC[lang],{weekday:"long"})+" "+d.getDate()+"/"+(d.getMonth()+1);
  $("#daySub").textContent=d.getFullYear();
  const tb=$("#today");tb.hidden=date===iso(new Date());tb.textContent=t("today");
  $("#tabC").textContent=t("clients");$("#tabP").textContent=t("products");
  $("#tabC").setAttribute("aria-selected",tab==="c");$("#tabP").setAttribute("aria-selected",tab==="p");
  const cl=dayClients(), pt=productTotals();
  const grand=cl.reduce((s,c)=>s+clientTotal(c),0);
  $("#barTot").textContent=fmt(grand);
  if(tab==="p"){
    const readyQ=pt.filter(r=>day.done[r.p]).reduce((s,r)=>s+r.q,0);
    const pct=grand?Math.round(readyQ/grand*100):0;
    $("#barLbl").innerHTML=`<b>${esc(t("written"))}</b> · ${pt.length} ${esc(t("prodShort"))}<br><span class="num">${esc(t("readyOf"))} <b>${fmt(readyQ)}</b> / ${fmt(grand)}</span><span class="prog"><i style="width:${pct}%"></i></span>`;
  }else{
    $("#barLbl").innerHTML=`<b>${esc(t("written"))}</b><br>`+T[lang].barL(cl.length,pt.length);
  }
  let h="";
  if(tab==="c"){
    if(!cl.length){h+=`<div class="empty"><b>${esc(t("emptyT"))}</b>${esc(t("emptyD"))}<div class="acts"><button class="btn primary" data-a="addClient">${esc(t("addClient"))}</button><button class="btn" data-a="copyPrev">${esc(t("copyPrev"))}</button></div></div>`}
    else{
      h+=`<div class="cards">`;
      for(const c of cl){
        const it=itemsOf(c);
        const cc=cfg.clients.find(x=>x.id===c);
        h+=`<section class="card"><div class="chead"><div class="cname"><h2><button class="nm" data-a="info" data-c="${c}">${esc(cName(c))}</button></h2>${cc&&cc.phone?`<span class="ph num">☎ ${esc(cc.phone)}</span>`:""}</div><span class="badge num">${fmt(clientTotal(c))}</span><button class="iconbtn" data-a="info" data-c="${c}" aria-label="${esc(t("contact"))}">ⓘ</button></div>`;
        if(it.length){h+=`<ul class="items">`+it.map(([p,q])=>`<li><span class="q num">${fmt(q)}</span><span class="n">${esc(pName(p))}</span><button class="step" data-a="dec" data-c="${c}" data-p="${p}" aria-label="−">−</button><button class="step" data-a="inc" data-c="${c}" data-p="${p}" aria-label="+">+</button></li>`).join("")+`</ul>`}
        h+=`<div class="cfoot"><button class="btn primary grow" data-a="write" data-c="${c}">✎ ${esc(t("write"))}</button><button class="btn ghost danger" data-a="rmClient" data-c="${c}">${esc(t("remove"))}</button></div></section>`;
      }
      h+=`</div><button class="btn addclient" data-a="addClient">${esc(t("addClient"))}</button>`;
    }
  }else{
    if(!pt.length){h+=`<div class="empty"><b>${esc(t("noOrders"))}</b>${esc(t("emptyD"))}</div>`}
    else{
      h+=`<div class="tot">`+pt.map(r=>`<div class="trow${day.done[r.p]?" done":""}"><button class="chk" data-a="done" data-p="${r.p}" aria-label="${esc(t("prepared"))}" aria-pressed="${!!day.done[r.p]}">${day.done[r.p]?"✓":""}</button><div class="tn"><b>${esc(pName(r.p))}</b><small>${r.by.map(([c,q])=>esc(cName(c))+" "+fmt(q)).join(" · ")}</small></div><div class="tq num">${fmt(r.q)}</div></div>`).join("")+`</div>`;
      const sumP=pt.reduce((s,r)=>s+r.q,0);
      const ok=Math.abs(sumP-grand)<1e-9;
      h+=`<div class="check num"><span>${esc(t("cliPage"))}</span><span class="v">${fmt(grand)}</span><span>${esc(t("totPage"))}</span><span class="v">${fmt(sumP)}</span><span class="res ${ok?"ok":"bad"}">${esc(ok?t("equal"):t("notEqual"))}</span></div>`;
      h+=`<div class="row"><button class="btn primary grow" data-a="copyText">${esc(t("copyText"))}</button></div><pre id="shareText" hidden></pre>`;
    }
  }
  $("#main").innerHTML=h;
  if(sheet) sheet.refresh();
}

/* ---------- sheets ---------- */
let sheet=null;
function openSheet(build){
  closeSheet();
  const scrim=document.createElement("div");scrim.className="scrim";
  const box=document.createElement("div");box.className="sheet";box.setAttribute("role","dialog");
  scrim.appendChild(box);$("#layer").appendChild(scrim);
  scrim.addEventListener("click",e=>{if(e.target===scrim) closeSheet()});
  sheet={box,refresh(){build(box)}};sheet.refresh();
}
function closeSheet(){$("#layer").innerHTML="";sheet=null}

/* order entry: type a number, tap a product — like writing "7 Σπανάκια" */
function writeSheet(cid){
  let buf="";
  openSheet(box=>{
    const it=itemsOf(cid), o=day.orders[cid]||{};
    box.innerHTML=`<div class="sh"><h3>${esc(cName(cid))} <span class="badge num">${fmt(clientTotal(cid))}</span></h3><button class="btn primary" data-s="close">${esc(t("done"))}</button></div>
    <ul class="mini">${it.map(([p,q])=>`<li><b class="num">${fmt(q)}</b> ${esc(pName(p))}<button data-s="rm" data-p="${p}" aria-label="${esc(t("remove"))}">✕</button></li>`).join("")}</ul>
    <div class="display"><span class="big num" id="buf">${buf?esc(buf.replace(".5","½")):"–"}</span><span class="hint">${esc(t("typeQty"))} (${esc(t("qtyHint"))})</span></div>
    <div class="pad">${["1","2","3","4","5","6","7","8","9","0","½","⌫"].map(k=>`<button data-k="${k}">${k}</button>`).join("")}</div>
    <div class="chips">${cfg.products.map(p=>`<button class="chip${o[p.id]>0?" has":""}" data-s="prod" data-p="${p.id}">${esc(p.name)}</button>`).join("")}</div>`;
    box.onclick=e=>{
      const b=e.target.closest("button");if(!b) return;
      if(b.dataset.k){const k=b.dataset.k;
        if(k==="⌫") buf=buf.endsWith(".5")?buf.slice(0,-2):buf.slice(0,-1);
        else if(k==="½"){if(!buf.includes(".5")) buf=(buf||"0")+".5"}
        else if(!buf.includes(".5")&&buf.length<3) buf=(buf==="0"?"":buf)+k;
        box.querySelector("#buf").textContent=buf?buf.replace(/^0\.5$/,"½").replace(".5","½"):"–";return}
      const s=b.dataset.s;
      if(s==="close") closeSheet();
      else if(s==="rm") patchDay({orders:{[cid]:{[b.dataset.p]:0}}});
      else if(s==="prod"){const q=buf===""?1:parseFloat(buf);buf="";patchDay({orders:{[cid]:{[b.dataset.p]:q}}})}
    };
  });
}

function addClientSheet(){
  let B=null;
  openSheet(box=>{
    if(box.dataset.built==="add"){filter();return}
    box.dataset.built="add";B=box;
    box.innerHTML=`<div class="sh"><h3>${esc(t("pickClient"))}</h3><button class="btn ghost" data-s="close">✕</button></div>
    <div class="field"><input id="q" type="search" autocomplete="off" placeholder="${esc(t("search"))}"></div>
    <div class="list" id="plist"></div>
    <div class="sec">${esc(t("newClient"))}</div>
    <form id="nf" class="list"><input class="inp" id="nc-name" autocomplete="off" placeholder="${esc(t("newName"))}"><input class="inp" id="nc-phone" type="tel" inputmode="tel" autocomplete="off" placeholder="${esc(t("phone"))}"><button class="btn primary" type="submit">${esc(t("add"))}</button></form>`;
    box.querySelector("#q").addEventListener("input",filter);
    box.querySelector("#nf").onsubmit=e=>{e.preventDefault();
      const v=box.querySelector("#nc-name").value.trim(), ph=box.querySelector("#nc-phone").value.trim();
      if(!v) {box.querySelector("#nc-name").focus();return}
      let c=cfg.clients.find(x=>x.name.toLowerCase()===v.toLowerCase());
      if(!c){c={id:uid(),name:v,phone:ph,note:""};cfg.clients.push(c);saveCfg()}
      else if(ph&&!c.phone){c.phone=ph;saveCfg()}
      pick(c.id)};
    box.onclick=e=>{const b=e.target.closest("button");if(!b) return;if(b.dataset.s==="close") closeSheet();if(b.dataset.s==="pick") pick(b.dataset.c)};
    filter();
  });
  function filter(){
    if(!B) return;
    const q=(B.querySelector("#q").value||"").trim().toLowerCase(), qd=q.replace(/\D/g,"");
    const on=new Set(dayClients());
    const avail=cfg.clients.filter(c=>!on.has(c.id)).filter(c=>!q||c.name.toLowerCase().includes(q)||(qd&&String(c.phone||"").replace(/\D/g,"").includes(qd)));
    B.querySelector("#plist").innerHTML=avail.length?avail.map(c=>`<button class="pick" data-s="pick" data-c="${c.id}"><span>${esc(c.name)}</span>${c.phone?`<small class="num">☎ ${esc(c.phone)}</small>`:""}</button>`).join(""):`<p style="color:var(--muted);margin:4px 0">${esc(q?t("noMatch"):(cfg.clients.length?t("allAdded"):""))}</p>`;
  }
  function pick(cid){patchDay({pos:{[cid]:Date.now()}});writeSheet(cid)}
}

/* client contact card */
function clientSheet(cid){
  openSheet(box=>{
    if(box.dataset.built===cid) return;
    const c=cfg.clients.find(x=>x.id===cid);if(!c){closeSheet();return}
    box.dataset.built=cid;
    const tel=String(c.phone||"").replace(/[^\d+]/g,"");
    box.innerHTML=`<div class="sh"><h3>${esc(c.name)}</h3><button class="btn ghost" data-s="close">✕</button></div>
    ${c.phone?`<div class="contact"><span class="big num" id="ci-show">${esc(c.phone)}</span><div class="row" style="margin-top:8px"><a class="btn primary grow" href="tel:${esc(tel)}">☎ ${esc(t("call"))}</a><button class="btn grow" data-s="copy">${esc(t("copyPhone"))}</button></div></div>`:""}
    <label class="lab" for="ci-name">${esc(t("name"))}</label><input class="inp" id="ci-name" autocomplete="off" value="${esc(c.name)}">
    <label class="lab" for="ci-phone">${esc(t("phone"))}</label><input class="inp" id="ci-phone" type="tel" inputmode="tel" autocomplete="off" value="${esc(c.phone||"")}">
    <label class="lab" for="ci-note">${esc(t("note"))}</label><textarea class="inp" id="ci-note" rows="3">${esc(c.note||"")}</textarea>
    <div class="row"><button class="btn primary grow" data-s="save">${esc(t("save"))}</button></div>`;
    box.onclick=async e=>{const b=e.target.closest("button");if(!b) return;const s=b.dataset.s;
      if(s==="close") closeSheet();
      else if(s==="copy"){try{await navigator.clipboard.writeText(c.phone);toast(t("copied"))}catch(err){const r=document.createRange();r.selectNodeContents(box.querySelector("#ci-show"));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast(t("copyFail"))}}
      else if(s==="save"){
        const cur=cfg.clients.find(x=>x.id===cid);if(!cur){closeSheet();return}
        const nm=box.querySelector("#ci-name").value.trim();
        if(nm) cur.name=nm;
        cur.phone=box.querySelector("#ci-phone").value.trim();
        cur.note=box.querySelector("#ci-note").value.trim();
        closeSheet();saveCfg();toast(t("saved"));
      }};
  });
}

function settingsSheet(){
  let armed=null;
  openSheet(box=>{
    const sec=(kind,title,ph)=>`<div class="sec">${esc(title)}</div><div class="list">${cfg[kind].map((x,i)=>`<div class="erow"><input value="${esc(x.name)}" data-kind="${kind}" data-i="${i}" id="e-${kind}-${x.id}">${kind==="clients"?`<button data-s="info" data-i="${i}" aria-label="${esc(t("contact"))}">☎</button>`:""}<button data-s="up" data-kind="${kind}" data-i="${i}" aria-label="up">↑</button><button class="del${armed===x.id?" arm":""}" data-s="del" data-kind="${kind}" data-i="${i}" aria-label="${esc(t("del"))}">${armed===x.id?esc(t("sure")):"✕"}</button></div>`).join("")}</div>
      <form class="field" style="margin-top:8px" data-kind="${kind}"><input placeholder="${esc(ph)}" autocomplete="off" id="add-${kind}"><button class="btn" type="submit">${esc(t("add"))}</button></form>`;
    box.innerHTML=`<div class="sh"><h3>${esc(t("settings"))}</h3><button class="btn primary" data-s="close">${esc(t("done"))}</button></div>
      <div class="sec">${esc(t("lang"))}</div><div class="langs">${[["tr","Türkçe"],["el","Ελληνικά"],["en","English"]].map(([k,n])=>`<button data-s="lang" data-l="${k}" aria-pressed="${lang===k}">${n}</button>`).join("")}</div>
      ${sec("products",t("prodList"),t("newProd"))}${sec("clients",t("clientList"),t("newName"))}
      <div class="sec">${esc(t("backup"))}</div><p style="margin:0 0 8px;color:var(--muted);font-size:14px">${esc(t("backupD"))}</p>
      <div class="row" style="margin-top:0"><button class="btn primary grow" data-s="export">${esc(t("exportB"))}</button><label class="btn grow" style="text-align:center">${esc(t("importB"))}<input type="file" id="impFile" accept=".json,application/json" hidden></label></div>
      <p id="impMsg" style="color:var(--warn);font-size:14px"></p>`;
    box.querySelector("#impFile").onchange=e=>{const f=e.target.files[0];if(!f) return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||d.app!=="klouves"||!d.data) throw 0;
        Object.keys(localStorage).filter(k=>k.startsWith("klv.db.")).forEach(k=>localStorage.removeItem(k));
        for(const k in d.data) localStorage.setItem(k,JSON.stringify(d.data[k]));
        cfg=local.load("cfg",cfg);closeSheet();watchDay();toast(t("restored"))}catch(err){box.querySelector("#impMsg").textContent=t("badFile")}};r.readAsText(f)};
    box.querySelectorAll(".erow input").forEach(inp=>inp.addEventListener("change",()=>{const v=inp.value.trim();if(!v) return;cfg[inp.dataset.kind][+inp.dataset.i].name=v;saveCfg()}));
    box.querySelectorAll("form").forEach(f=>f.onsubmit=e=>{e.preventDefault();const inp=f.querySelector("input");const v=inp.value.trim();if(!v) return;cfg[f.dataset.kind].push({id:uid(),name:v});saveCfg()});
    box.onclick=e=>{const b=e.target.closest("button");if(!b||b.type==="submit") return;const s=b.dataset.s,k=b.dataset.kind,i=+b.dataset.i;
      if(s==="close"){closeSheet();return}
      if(s==="info"){clientSheet(cfg.clients[i].id);return}
      if(s==="export"){const data={};try{Object.keys(localStorage).filter(k=>k.startsWith("klv.db.")).forEach(k=>data[k]=JSON.parse(localStorage.getItem(k)))}catch(err){}
        const blob=new Blob([JSON.stringify({app:"klouves",at:new Date().toISOString(),data})],{type:"application/json"});
        const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="klouves-backup-"+iso(new Date())+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return}
      if(s==="lang"){lang=b.dataset.l;ls.set("klv.lang2",lang);render();return}
      if(s==="up"&&i>0){const a=cfg[k];[a[i-1],a[i]]=[a[i],a[i-1]];saveCfg();return}
      if(s==="del"){const x=cfg[k][i];if(armed===x.id){cfg[k].splice(i,1);armed=null;saveCfg()}else{armed=x.id;sheet.refresh()}}
    };
  });
}

/* ---------- actions ---------- */
let rmArmed=null;
$("#main").addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b) return;const a=b.dataset.a,c=b.dataset.c,p=b.dataset.p;
  if(a==="addClient") addClientSheet();
  else if(a==="write") writeSheet(c);
  else if(a==="info") clientSheet(c);
  else if(a==="inc"||a==="dec"){const q=Math.max(0,((day.orders[c]||{})[p]||0)+(a==="inc"?.5:-.5));patchDay({orders:{[c]:{[p]:q}}})}
  else if(a==="rmClient"){
    if(rmArmed!==c){rmArmed=c;b.textContent=t("sure");setTimeout(()=>{if(rmArmed===c){rmArmed=null;render()}},3000);return}
    rmArmed=null;const z={};for(const k in (day.orders[c]||{})) z[k]=0;patchDay({pos:{[c]:0},orders:{[c]:z}})}
  else if(a==="done") patchDay({done:{[p]:!day.done[p]}});
  else if(a==="copyPrev") copyPrev();
  else if(a==="copyText"){
    const d=parseIso(date);const pt=productTotals();
    const txt=d.toLocaleDateString(LOC[lang],{weekday:"long",day:"numeric",month:"numeric"})+"\n"+pt.map(r=>pName(r.p)+" → "+fmt(r.q)).join("\n")+"\n= "+fmt(pt.reduce((s,r)=>s+r.q,0))+" "+t("crates");
    try{await navigator.clipboard.writeText(txt);toast(t("copied"))}catch(err){const pre=$("#shareText");pre.hidden=false;pre.textContent=txt;pre.style.whiteSpace="pre-wrap";const r=document.createRange();r.selectNodeContents(pre);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast(t("copyFail"))}
  }
});
async function copyPrev(){
  for(let i=1;i<=14;i++){
    const d=shift(date,-i);let src=null;
    if(db){try{const s=await db.doc("days/"+d).get();if(s.exists) src=s.data()}catch(e){}}
    else src=local.load("day."+d,null);
    if(src&&Object.values(src.pos||{}).some(v=>v>0)){
      const nd={orders:JSON.parse(JSON.stringify(src.orders||{})),pos:JSON.parse(JSON.stringify(src.pos||{})),done:{}};
      day=nd;render();
      if(db){try{await db.doc("days/"+date).set(nd);ready[date]=Promise.resolve()}catch(e){toast(e.message||"Error")}}else local.save("day."+date,nd);
      toast(t("copied"));return;
    }
  }
  toast(t("noPrev"));
}
function go(n){date=n===0?iso(new Date()):shift(date,n);closeSheet();watchDay()}
$("#prev").onclick=()=>go(-1);$("#next").onclick=()=>go(1);$("#today").onclick=()=>go(0);
$("#tabC").onclick=()=>{tab="c";ls.set("klv.tab",tab);render()};
$("#tabP").onclick=()=>{tab="p";ls.set("klv.tab",tab);render()};
$("#settings").onclick=settingsSheet;

/* ---------- boot ---------- */
cfg=local.load("cfg",null)||{products:[{"id":"spanaki","name":"Σπανάκι"},{"id":"agria","name":"Άγρια"},{"id":"vlita","name":"Βλήτα"},{"id":"maintanos","name":"Μαϊντανός"},{"id":"anithos","name":"Άνηθος"},{"id":"selino","name":"Σέλινο"},{"id":"patzaria","name":"Παντζάρια"},{"id":"roka","name":"Ρόκα"},{"id":"kremmydi","name":"Κρεμμύδι"},{"id":"praso","name":"Πράσο"},{"id":"radikia","name":"Ραδίκια"},{"id":"antidia","name":"Αντίδια"},{"id":"koliandro","name":"Κόλιανδρο"},{"id":"seskoula","name":"Σέσκουλα"},{"id":"lachana","name":"Λάχανα"}]
,clients:[]};local.save("cfg",cfg);
watchDay();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
</script>
